<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%A1%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1b4d;--bg:#eef2ff;--pri:#4f46e5;--pk:#ff3d8b;--gold:#ffb300;--gr:#14b870;--rd:#ee3f5c;--ln:#dcd9f7;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#fff0c7 0,transparent 38%),radial-gradient(circle at 96% 8%,#ffd6ea 0,transparent 34%),var(--bg) fixed;color:var(--ink);font:500 16px 'Baloo 2',system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:nowrap;gap:5px;align-items:center;padding:6px 10px;background:#fffffff5;box-shadow:0 2px 14px #4f46e522;transition:transform .22s;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}header.hid{transform:translateY(-115%)}header h1{font-size:22px;flex:0 0 auto}header button,header .b{font-size:13px;padding:5px 8px;border-radius:9px;flex:0 0 auto}header label{font-size:12px;flex:0 0 auto}header #sp{font-size:12px;padding:4px 8px;flex:0 0 auto}header #cs{font-size:13px;padding:5px 7px;margin:0 2px 0 0;flex:0 0 auto;max-width:150px}header input[type=checkbox]{margin-right:3px}
h1{margin:0 auto 0 0;font-size:28px;color:var(--pri)}h2,h3{margin:.2em 0}
button,.b{font:inherit;font-weight:700;border:0;border-radius:12px;padding:7px 13px;background:#e9e7ff;color:var(--pri);cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
button:hover:not(:disabled),.b:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 6px 14px #4f46e533;background:#dcd8ff}button:active{transform:scale(.95)}:focus-visible{outline:3px solid var(--pk)}
.p{background:var(--pk);color:#fff}.p:hover:not(:disabled){background:#ff5a9c}.g{background:var(--gold);color:#3b2a00}.g:hover:not(:disabled){background:#ffc733}label{cursor:pointer;font-size:14px}.tag{padding:6px 12px;border-radius:12px;background:#dcf8ea;color:#0b7a4b;font-weight:700}
input,select,textarea{font:inherit;display:block;width:100%;padding:7px 10px;border-radius:10px;border:2px solid var(--ln);background:#fff;color:var(--ink);margin:2px 0 8px}input[type=checkbox]{display:inline;width:auto;margin:0 4px 0 0}#cs{width:auto;margin:0;font-weight:700}
main{display:grid;grid-template-columns:1fr 290px;gap:14px;padding:14px}@media(max-width:900px){main{grid-template-columns:1fr}}
#gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-content:start}
.c{background:#fff;border-radius:20px;padding:12px;border:3px solid var(--ln);display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 14px #4f46e514;transition:transform .2s,box-shadow .2s,border-color .5s}.c:hover{transform:translateY(-4px);box-shadow:0 14px 28px #4f46e533}
.c.t1{border-color:var(--gold)}.c.t1 .nm::before{content:'👑 '}.c.done{border-color:#19b5a5;box-shadow:0 0 0 4px #19b5a52e,0 4px 14px #19b5a533}.ok{font-size:12px;background:#19b5a5;color:#fff;border-radius:99px;padding:1px 9px}
.hd{display:flex;gap:8px;align-items:center}.av{font-size:36px;cursor:pointer;transition:transform .2s}.av:hover{transform:rotate(-12deg) scale(1.2)}.nm{flex:1;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{position:relative}input.sc{margin:0;padding:2px 10px;font:800 46px 'Baloo 2',system-ui,sans-serif;color:var(--pri);background:#f4f3ff;border:2px dashed var(--ln);border-radius:14px;line-height:1.2;transition:border-color .2s,background .2s}input.sc:hover{border-color:var(--pri);background:#fff}input.sc.pop{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.15);color:var(--pk)}}.dl{position:absolute;right:12px;top:-4px;font:800 32px 'Baloo 2';pointer-events:none;animation:fl 1.3s forwards}.dl.up{color:var(--gr)}.dl.dn{color:var(--rd)}@keyframes fl{to{transform:translateY(-34px);opacity:0}}
.c.fu{animation:fu .9s}.c.fd{animation:fd .7s}@keyframes fu{30%{background:#d6fbe7}}@keyframes fd{20%,60%{transform:translateX(-6px);background:#ffe0e6}40%,80%{transform:translateX(6px)}}
.fxs{min-height:56px;display:grid;grid-template-columns:repeat(3,max-content);gap:6px 8px;align-items:center;justify-content:start}.fb{font-size:36px;line-height:1;display:inline-flex;align-items:flex-end;gap:3px;padding:4px 9px;border-radius:14px;cursor:help;transition:transform .2s}.fb:hover{transform:scale(1.2)}.fb small{font:800 18px 'Baloo 2'}
.fb.g{background:#dcf8ea;animation:glow 2s infinite}.fb.b{background:#ffe3e8;animation:wob 1.2s infinite}@keyframes glow{50%{box-shadow:0 0 0 7px #14b87033;transform:scale(1.08)}}@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.nofx .fb,.nofx .sc,.nofx .dl{animation:none!important}@media(prefers-reduced-motion:reduce){.fb,.sc,.dl{animation:none!important}}
.big{padding:10px 16px;font-size:17px;font-weight:800}.qa{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.qa button{width:32px;height:32px;padding:0;border-radius:50%;font-size:13px}.tl{display:flex;gap:6px}.tl button{flex:1}
aside{background:#fff;border-radius:20px;padding:12px;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;box-shadow:0 4px 14px #4f46e514;transition:top .3s}body.hh aside{top:12px}
ol{list-style:none;margin:0;padding:0}li.r{display:flex;gap:6px;align-items:center;padding:5px 8px;border-radius:12px;transition:transform .15s,background .15s}li.r:hover{transform:translateX(5px);background:#efedff}li.r span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li.r i{font-style:normal;width:22px;color:#8a88b8}li.r0{background:#fff0bd}li.r1{background:#eceef6}li.r2{background:#ffe5d2}li.r b{color:var(--pri)}
dialog{border:0;border-radius:22px;background:#fff;color:var(--ink);width:min(94vw,560px);padding:20px;max-height:94vh;box-shadow:0 20px 60px #1f1b4d55}dialog::backdrop{background:#1f1b4d88}
.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}.pi{text-align:left;padding:7px 10px;font-size:14px;line-height:1.25}.pi.on{background:var(--gold);color:#3b2a00}
#wl{width:min(96vw,1000px);padding:18px 22px;text-align:center;overflow:hidden;background:linear-gradient(#fff,#f1efff)}#rv{position:relative;overflow:hidden;border-radius:18px;background:#1f1b4d;padding:16px 0;margin:12px 0;box-shadow:inset 0 0 30px #000a}
#rs{display:flex;gap:10px;width:max-content}.tl2{flex:0 0 190px;height:124px;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;font-weight:700;font-size:15px;line-height:1.15}.tl2 i{font-style:normal;font-size:34px}.tl2 span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl2.g{background:linear-gradient(#22c985,#10a066)}.tl2.b{background:linear-gradient(#ff6a82,#d93757)}.tl2.n{background:linear-gradient(#ffc933,#f09a00);color:#3b2a00}
.mk{position:absolute;left:50%;top:0;bottom:0;width:5px;background:var(--pk);transform:translateX(-50%);box-shadow:0 0 16px var(--pk);z-index:2}.rt{font-size:24px;margin:4px 0}.ch{display:inline-block;background:#efedff;border-radius:99px;padding:3px 12px;margin:3px;font-size:14px}
.tw{max-height:74vh;overflow:auto}.hi{border-bottom:1px solid var(--ln);padding:6px 0}.hi ul{font-size:14px}.fl{display:flex;gap:8px}table{width:100%;border-collapse:collapse}td{padding:2px 4px;vertical-align:top}td input,td textarea{margin:0}td textarea{resize:vertical;font-size:15px;line-height:1.3}.tx{width:62%}.tg td:first-child{border-left:4px solid var(--gr)}.tb td:first-child{border-left:4px solid var(--rd)}.tn td:first-child{border-left:4px solid var(--gold)}

button:disabled{opacity:.5;cursor:not-allowed}
.fxs.s2,.fxs.s3{min-height:0}.fxs.s2 .fb{font-size:28px;padding:3px 7px;border-radius:12px}.fxs.s2 .fb small{font-size:14px}.fxs.s3 .fb{font-size:21px;padding:2px 5px;border-radius:10px}.fxs.s3 .fb small{font-size:11px}.fxs .fb.mo{font:800 16px 'Baloo 2',system-ui,sans-serif;background:#e9e7ff;color:var(--pri);cursor:pointer;align-items:center}
.mr{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}.mr span{flex:1;min-width:0}.mr button{flex:0 0 auto;padding:5px 9px;font-size:13px}.bt .hx{display:none}
.c.m1{border-color:#e0a100;background:linear-gradient(160deg,#fff7d1,#ffe27a)}.c.m1 .nm::before{content:'🥇 '}
.c.m2{border-color:#98a2b3;background:linear-gradient(160deg,#fcfdff,#d7dde8)}.c.m2 .nm::before{content:'🥈 '}
.c.m3{border-color:#c47a3d;background:linear-gradient(160deg,#ffeadb,#e7b087)}.c.m3 .nm::before{content:'🥉 '}
li.r.rk1{background:linear-gradient(90deg,#ffe58a,#fff3c2)}li.r.rk2{background:linear-gradient(90deg,#d5dbe6,#f1f4fa)}li.r.rk3{background:linear-gradient(90deg,#e8b089,#ffe5d2)}li.r.me{outline:2px solid var(--pk)}
li.r.up{animation:lu .9s}li.r.dn{animation:ld .9s}@keyframes lu{30%{background:#bff5d8}}@keyframes ld{30%{background:#ffc9d2}}
.stg{display:grid;grid-template-columns:1fr 250px;gap:16px}.stg .sm{min-width:0}.ctr{text-align:center}.lbw{background:#f4f3ff;border-radius:16px;padding:10px;text-align:left;max-height:72vh;overflow:auto}.lbw h3{font-size:18px;margin:0 0 6px}@media(max-width:760px){.stg{grid-template-columns:1fr}.lbw{max-height:30vh}}
.rvx{position:relative;overflow:hidden;border-radius:18px;background:#1f1b4d;padding:16px 0;margin:12px 0;box-shadow:inset 0 0 30px #000a}.rsx{display:flex;gap:10px;width:max-content}
.coinw{perspective:700px;height:170px;display:flex;align-items:center;justify-content:center}.coin{width:130px;height:130px;position:relative;transform-style:preserve-3d}
.cfc{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 22px 'Baloo 2',system-ui,sans-serif;box-shadow:inset 0 0 0 7px #0002,0 6px 16px #0003}.cfc small{font-size:34px}
.cfc.h{background:radial-gradient(circle at 35% 30%,#fff1a6,#f5b400);color:#5a3b00}.cfc.t{background:radial-gradient(circle at 35% 30%,#fff,#aab4c6);color:#2d3650;transform:rotateY(180deg)}
.coinw.tossing{animation:toss var(--td,2.4s) ease-out}@keyframes toss{0%,100%{transform:translateY(0)}45%{transform:translateY(-70px)}}
.die{width:120px;height:120px;margin:14px auto;border-radius:22px;background:#fff;border:4px solid var(--pri);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;gap:4px;box-shadow:0 8px 20px #4f46e544}.die i{border-radius:50%}.die i.on{background:var(--pri)}.die.shake{animation:shk .18s infinite}@keyframes shk{25%{transform:rotate(-9deg) translateY(-4px)}75%{transform:rotate(9deg) translateY(2px)}}
.rn{font:800 90px 'Baloo 2',system-ui,sans-serif;color:var(--pri);line-height:1.1;margin:8px 0}
.opt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}.opt button{min-width:64px;font-size:20px}.opt button.on{background:var(--gold);color:#3b2a00}
.nofx .coinw.tossing,.nofx .die.shake,.nofx li.r.up,.nofx li.r.dn{animation:none!important}

#wl{width:min(98vw,1180px);max-width:1180px}

/* Đồng bộ nút đóng và thao tác đóng vòng quay với giao diện Quiz Battle */
#wl{position:relative;border:3px solid #dcd9f7;border-radius:24px;box-shadow:0 22px 70px #1f1b4d66}
#wl::backdrop{background:#1f1b4dcc;backdrop-filter:blur(5px)}
#wl .wheel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px;text-align:left}
#wl .wheel-kicker{font-size:12px;letter-spacing:.08em;font-weight:800;color:#7773c9}
#wl .wheel-close{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;background:#fff0f3;color:#c0264d;border:1px solid #ffc7d4;border-radius:12px;box-shadow:0 3px 10px #ee3f5c1a}
#wl .wheel-close:hover:not(:disabled){background:#ffe0e8;box-shadow:0 6px 14px #ee3f5c33}
#wl .wheel-actions{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}
#wl .wheel-hint{font-size:13px;color:#7773a6;margin:8px 0}
#wl #rv{border:2px solid #393276;box-shadow:inset 0 0 30px #000a,0 8px 20px #4f46e522}
#wl #wh{font-weight:800;color:#4f46e5}
@media(max-width:600px){#wl{padding:12px!important}#wl .wheel-kicker{font-size:10px}#wl .wheel-close span{display:none}}

/* Bảng xếp hạng chính nổi lên thành cửa sổ riêng khi quay vòng quay / xử lý quà */
#bk{display:none;position:fixed;inset:0;background:#1f1b4dcc;backdrop-filter:blur(5px);z-index:900}
body.rkon #bk{display:block}
body.rkon{overflow:hidden}
body.rkon dialog[open],body.rkon #wl[open]{position:fixed;inset:0 calc(min(330px,34vw) + 28px) 0 12px;margin:auto;z-index:910;max-width:calc(100vw - min(330px,34vw) - 52px)!important}
body.rkon #dg[open]{z-index:920}
body.rkon aside{position:fixed;align-self:stretch;top:12px;right:12px;bottom:12px;width:min(330px,34vw);max-height:none;z-index:930;overflow-y:auto;overflow-x:hidden;border:3px solid #ffc83d;box-shadow:0 0 0 5px #ffc83d44,0 0 30px #ffb30099;animation:rankGlow 1.8s ease-in-out infinite}
@keyframes rankGlow{50%{box-shadow:0 0 0 8px #ffc83d33,0 0 38px #ffb300bb}}
body.rkon .lbx li.r{min-width:0;max-width:100%;overflow:hidden}
body.rkon .lbx li.r small{flex:0 0 auto;max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:760px){
 body.rkon aside{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:32vh}
 body.rkon dialog[open],body.rkon #wl[open]{inset:0 8px calc(32vh + 20px) 8px;max-width:calc(100vw - 16px)!important;max-height:calc(68vh - 16px);overflow:auto}
}

/* Hai nút tròn cạnh tiêu đề */
header h1{margin:0 8px 0 0}
header .hm{font-size:20px;padding:6px 9px;border-radius:12px;flex:0 0 auto}
header .rb{flex:0 0 auto;width:66px;height:66px;min-width:66px;padding:0;border-radius:50%;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1;text-align:center;border:3px solid #fff;box-shadow:0 4px 14px #4f46e544}
header .rb b{font:800 21px/1 'Baloo 2',system-ui,sans-serif}
header .rb small{font:700 10px/1.1 'Baloo 2',system-ui,sans-serif;letter-spacing:0;margin-top:2px;white-space:nowrap}
header #sp.rb{padding:0;font-size:inherit;background:linear-gradient(145deg,#2fd89a,#0e9f6e);color:#fff;cursor:default}
header #sp.rb.full{background:linear-gradient(145deg,#ffd35a,#f59e0b);color:#3b2a00;animation:glow 2s infinite}
header .rb.nr{margin-right:auto;background:linear-gradient(145deg,#ff6aa5,#ee2f6f);color:#fff}
header .rb.nr b{font-size:26px}
header .rb.nr:hover:not(:disabled){background:linear-gradient(145deg,#ff86b6,#f2437f);transform:rotate(-8deg) scale(1.1)}
header .rb.nr:hover b{display:inline-block;animation:spin1 .6s}
@keyframes spin1{to{transform:rotate(360deg)}}
/* Màn hình chính + chọn lớp */
#lobby{position:fixed;inset:0;z-index:800;display:none;overflow:auto;padding:24px 16px;background:radial-gradient(circle at 15% 10%,#fff0c7 0,transparent 40%),radial-gradient(circle at 90% 15%,#ffd6ea 0,transparent 38%),radial-gradient(circle at 50% 100%,#d9d4ff 0,transparent 50%),#eef2ff}
body.lobby{overflow:hidden}body.lobby #lobby{display:flex}
#lobby .lw{margin:auto;width:min(1000px,100%);text-align:center}
#lobby .logo{font-size:clamp(84px,16vw,150px);line-height:1;display:inline-block;animation:lspin 14s linear infinite;filter:drop-shadow(0 10px 18px #4f46e555)}
@keyframes lspin{to{transform:rotate(360deg)}}
#lobby h1.lt{margin:6px 0 4px;font-size:clamp(40px,8vw,76px);letter-spacing:.02em;background:linear-gradient(90deg,#4f46e5,#ff3d8b,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
#lobby .ls{margin:0 0 26px;font-size:clamp(15px,2.4vw,20px);color:#6b66b8;font-weight:700}
#lobby .play{font-size:clamp(24px,4vw,36px);padding:16px 54px;border-radius:99px;background:linear-gradient(145deg,#ff6aa5,#ee2f6f);color:#fff;box-shadow:0 12px 30px #ee2f6f66;animation:lpulse 1.8s ease-in-out infinite}
#lobby .play:hover:not(:disabled){background:linear-gradient(145deg,#ff86b6,#f2437f);transform:scale(1.08)}
@keyframes lpulse{50%{box-shadow:0 12px 44px #ee2f6faa;transform:scale(1.04)}}
#lobby h2.lh{font-size:clamp(26px,4.5vw,40px);margin:0 0 4px;color:var(--pri)}
#lobby .lcs{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:20px 0 14px;text-align:center}#lobby .lcs .lc{flex:0 1 250px;min-width:210px}
#lobby .lc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 14px;border-radius:26px;background:#fff;border:3px solid var(--ln);box-shadow:0 8px 22px #4f46e522;color:var(--ink);cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
#lobby .lc:hover:not(:disabled){transform:translateY(-8px) scale(1.04);border-color:var(--pk);box-shadow:0 20px 40px #ff3d8b44;background:#fff}
#lobby .lc .ic{font-size:64px;line-height:1.1}
#lobby .lc .nm2{font-size:24px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lobby .lc .info{font-size:15px;color:#6b66b8;font-weight:700}
#lobby .lc .lead{font-size:13px;background:#fff3c4;color:#6b4a00;border-radius:99px;padding:2px 12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lobby .lc.add{border-style:dashed;background:#ffffffaa;color:var(--pri);justify-content:center}
#lobby .lc.add .ic{font-size:54px}
#lobby .back{margin-top:6px}
.nofx #lobby .logo,.nofx #lobby .play{animation:none!important}

/* Thẻ lớp: nút sửa / xóa nhỏ ở góc */
#lobby .lc{position:relative;text-align:center;font:inherit}
#lobby .lc .ctl{position:absolute;top:10px;right:10px;display:flex;gap:6px}
#lobby .lc .ctl button{width:30px;height:30px;padding:0;border-radius:50%;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;background:#f1efff;box-shadow:none;opacity:.7}
#lobby .lc:hover .ctl button{opacity:1}
#lobby .lc .ctl button:hover:not(:disabled){background:#dcd8ff;transform:scale(1.15)}
#lobby .lc .ctl button.x:hover:not(:disabled){background:#ffe3e8}
/* Popup thông tin hiệu ứng / hũ */
.fb[data-a=fxi]{cursor:pointer}
.fxr{background:#f4f3ff;border-radius:14px;padding:10px 14px;margin:8px 0;text-align:left;line-height:1.45}
button#pt{cursor:pointer}

/* Giờ vàng: nền vàng + chữ x2 nhảy ở góc, đi theo khi cuộn */
body.gold{background:radial-gradient(circle at 8% 0,#fff0a0 0,transparent 45%),radial-gradient(circle at 96% 10%,#ffd24a 0,transparent 40%),linear-gradient(180deg,#fff4c2,#ffe28a) fixed}
body.gold::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(115deg,transparent 38%,#ffffff99 50%,transparent 62%);background-size:260% 100%;animation:gshine 3.6s linear infinite}
@keyframes gshine{from{background-position:130% 0}to{background-position:-130% 0}}
#gx2{display:none;position:fixed;left:18px;bottom:16px;z-index:700;pointer-events:none;text-align:center;line-height:1}
body.gold #gx2{display:block;animation:gbounce 1.1s ease-in-out infinite;transform-origin:50% 90%}

function parse(lines,label,me){const ev=[],pl=n=>S.st.find(p=>p.n===n);let sk=-1,m;
if(/Nổ hũ/.test(label||'')&&!lines.some(l=>/Hũ đang trống/.test(l)))ev.push(['gold','🏺 NỔ HŨ!']);
for(let i=0;i<lines.length;i++){const s=lines[i];
if(m=s.match(/^🔄 (.+) \((-?\d+)\) ⇄ (.+) \((-?\d+)\)$/)){const a=pl(m[1]),b=pl(m[3]);a&&b&&ev.push(['swap',a,b,+m[2],+m[4]]);continue}
if(/^💣 Bom nổ/.test(s)){me&&ev.push(['boom',me,'💣','BÙM!']);sk=i+1;continue}
if(/^🪤 Bẫy sập/.test(s)){me&&ev.push(['boom',me,'🪤','SẬP BẪY!']);sk=i+1;continue}
if(/^🌪️ Thuế bão/.test(s)){ev.push(['storm']);continue}
if(/^🌟 Giờ vàng/.test(s))continue;
if(m=s.match(/^✖️(\d) Phiếu nhân/)){me&&ev.push(['mult',me,+m[1]]);continue}
if(m=s.match(/^🛡️ Khiên của (.+) chặn/)){pl(m[1])&&ev.push(['blk',pl(m[1]),'🛡️','#4f46e5']);continue}
if(m=s.match(/^🎫 (.+) dùng Vé miễn tử/)){pl(m[1])&&ev.push(['blk',pl(m[1]),'🎫','#ffb300']);continue}
if(m=s.match(/^🔰 (.+) dùng Lớp bảo vệ/)){pl(m[1])&&ev.push(['blk',pl(m[1]),'🔰','#14b870']);continue}
if(m=s.match(/^🪞 (.+) phản đòn khoản phạt (\d+) điểm về (.+) \(/)){const a=pl(m[1]),b=pl(m[3]);a&&b&&ev.push(['refl',a,b,+m[2]]);continue}
if(m=s.match(/^📦 (.+) giữ phiếu/)){pl(m[1])&&ev.push(['bag',pl(m[1])]);continue}
if(m=s.match(/^💥 Khiên vỡ: (.+) mất (\d+) khiên/)){pl(m[1])&&ev.push(['shbreak',pl(m[1]),+m[2]]);continue}
if(m=s.match(/^🔨 (.+) phá (\d+) khiên của (.+) \(/)){pl(m[3])&&ev.push(['shbreak',pl(m[3]),+m[2]]);continue}
if(m=s.match(/^🤝 (.+) tặng 1 khiên cho (.+)$/)){const a=pl(m[1]),b=pl(m[2]);a&&b&&ev.push(['shgive',a,b]);continue}
if(m=s.match(/^🌵 Khiên gai: (.+) bị đâm −(\d+)/)){pl(m[1])&&ev.push(['thorn',pl(m[1]),+m[2]]);continue}
if(m=s.match(/^🔮 Khiên phản chiếu: trả đòn (\d+) điểm về (.+)$/)){pl(m[2])&&ev.push(['mirror',pl(m[2]),+m[1]]);continue}
if(m=s.match(/^(.+): 🛡️ (\d+)→(\d+)$/)){const p=pl(m[1]);p&&+m[3]>+m[2]&&ev.push(['shup',p,+m[3]-+m[2]]);continue}
if(m=s.match(/^🏦 (.+) gửi (\d+) điểm tiết kiệm/)){pl(m[1])&&ev.push(['bank',pl(m[1]),+m[2]]);continue}
if(m=s.match(/^🏦 (.+) nhận lại (\d+) điểm tiết kiệm/)){pl(m[1])&&ev.push(['bankout',pl(m[1]),+m[2]]);continue}
if(m=s.match(/^🧲 (.+) thu phí qua đường \+1 từ (.+)$/)){const a=pl(m[1]),b=pl(m[2]);a&&b&&ev.push(['toll',a,b]);continue}
if(m=s.match(/^🧯 (.+) được bảo hiểm hoàn (\d+) điểm/)){pl(m[1])&&ev.push(['ins',pl(m[1]),+m[2]]);continue}
if(m=s.match(/^🏰 (.+) dựng Pháo đài/)){pl(m[1])&&ev.push(['fort',pl(m[1])]);continue}
if(m=s.match(/^🆘 Cứu trợ (.+)$/)){pl(m[1])&&ev.push(['relief',pl(m[1])]);continue}
if(/^🎰 JACKPOT/.test(s)){ev.push(['gold','🎰 JACKPOT!']);continue}
if(m=s.match(/^(.+): (-?\d+)→(-?\d+)$/)){const p=pl(m[1]),a=+m[2],b=+m[3];if(!p)continue;if(b===0&&a>0)ev.push(['boom',p,'💥','VỀ 0!']);else if(a>0&&b>a&&(b/a===2||b/a===3))ev.push(['mult',p,b/a]);else if(b>a)ev.push(['up',p,b-a]);continue}
if(m=s.match(/^(.+): -(\d+) \((-?\d+)→(-?\d+)\)$/)){const p=pl(m[1]),n=+m[2];let j=i+1;while(/^🧯/.test(lines[j]||''))j++;const nx=lines[j]||'';if(!p)continue;if(sk===i)continue;let q;for(let k=i+1;k<j;k++){const z=lines[k].match(/^🧯 (.+) được bảo hiểm hoàn (\d+)/);z&&pl(z[1])&&ev.push(['ins',pl(z[1]),+z[2]])}i=j-1;
if((q=nx.match(/^(.+): \+(\d+) \(/))&&pl(q[1])&&pl(q[1])!==p){ev.push(['steal',p,pl(q[1]),n]);i++;continue}
if(/^🏺/.test(nx)){ev.push(['pot',p,n]);i++;continue}
ev.push(['hit',p,n,+m[4]===0]);continue}
if(m=s.match(/^(.+): \+(\d+) \(/)){const p=pl(m[1]);p&&ev.push(['up',p,+m[2]])}}
return ev}
