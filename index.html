<meta name="theme-color" content="#3a5bff">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#16213e;--mut:#6a7490;--line:#dde3f0;--pri:#3a5bff;--ok:#16a34a;--bad:#e5484d;--yel:#ffc93c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#0f1426;--card:#19203a;--ink:#e8ecfa;--mut:#97a1c4;--line:#2a3354;--pri:#6c86ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
#app{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:clamp(26px,5vw,38px);margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);margin:4px 0 24px}
.crumb{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:14px;margin-bottom:10px;flex-wrap:wrap}
.crumb a{cursor:pointer;color:var(--pri);font-weight:500}.crumb a:hover{text-decoration:underline}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 18px 36px -14px hsl(var(--h) 70% 40%/.5);border-color:hsl(var(--h) 70% 60%)}
.card:active{transform:translateY(-2px) scale(.98)}
.band{height:104px;background:linear-gradient(135deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 40) 75% 46%));display:flex;align-items:flex-end;padding:12px 16px;color:#fff;font-size:38px;font-weight:800;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.18);transition:transform .4s}
.card:hover .band::after{transform:scale(1.6)}
.cb{padding:14px 16px 16px}.cb b{display:block;font-size:17px;word-break:break-word}.cb span{color:var(--mut);font-size:13px}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transform:translateY(-4px);transition:.2s}
.card:hover .tools,.card:focus-within .tools{opacity:1;transform:none}
.ib{border:0;background:rgba(255,255,255,.9);color:#16213e;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px;transition:transform .15s,background .15s}
.ib:hover{transform:scale(1.15);background:#fff}
.add{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;border:2px dashed var(--line);background:transparent;color:var(--mut);font-weight:500;gap:6px}
.add i{font-style:normal;font-size:34px;line-height:1;transition:transform .3s}
.add:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-4px)}.add:hover i{transform:rotate(90deg) scale(1.2)}

.afx.sl{animation-name:afSl}.afx.zp{animation-name:afZp}.afx.dr{animation-name:afDr}.afx.rg{animation-name:afRg}.afx.rs{animation-name:afRs}.afx.sp{animation-name:afSp}.afx.gl{animation-name:afGl}.afx.bn{animation-name:afBn2}
@keyframes arAtk{40%{transform:translateX(var(--d))}100%{transform:none}}@keyframes arHit{0%,100%{transform:none}20%{transform:translateX(-12px);filter:brightness(2) sepia(1) hue-rotate(-40deg)}60%{transform:translateX(12px)}}
@keyframes afSl{0%{transform:translate(-120%,-30px) rotate(-70deg);opacity:0}40%{opacity:1}100%{transform:translate(20%,30px) rotate(40deg);opacity:0}}
@keyframes afZp{0%,40%,80%{opacity:0}20%,60%,100%{opacity:1;transform:translateX(-50%) scale(1.7)}100%{opacity:0}}
@keyframes afDr{0%{transform:translate(-50%,-200px) scale(.5);opacity:1}60%{transform:translate(-50%,40px) scale(1.4)}100%{transform:translate(-50%,40px) scale(2.6);opacity:0}}

@keyframes afSp{0%{transform:translateX(-50%) rotate(0) scale(.3);opacity:1}60%{transform:translateX(-50%) rotate(540deg) scale(1.5)}100%{transform:translateX(-50%) rotate(720deg) scale(0);opacity:0}}
@keyframes afGl{0%{transform:translateX(-50%) scale(.3);opacity:0}50%{opacity:1;transform:translateX(-50%) scale(1.8)}100%{transform:translateX(-50%) scale(2.4);opacity:0}}
@keyframes afBn2{0%{transform:translate(-50%,-120px);opacity:0}30%{transform:translate(-50%,0);opacity:1}50%{transform:translate(-50%,-40px)}70%{transform:translate(-50%,0)}100%{transform:translate(-50%,-30px) scale(.2);opacity:0}}

.agf{display:flex;align-items:center;gap:12px;margin:0 0 10px;padding:8px 14px;border-radius:14px;border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}.agf>span{font-size:34px}.agf small{display:block;color:var(--mut);font-weight:600}

@keyframes rvIn{0%{transform:scale(.2) rotate(-14deg);opacity:0}12%{transform:scale(1.25) rotate(4deg);opacity:1}20%,56%{transform:scale(1);opacity:1}88%{transform:translate(var(--tx,0px),var(--ty,-40px)) scale(.2) rotate(8deg);opacity:1}100%{transform:translate(var(--tx,0px),var(--ty,-40px)) scale(.08);opacity:0}}
.evd .afx{animation-delay:2.2s}@keyframes rvLate{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}.evd .a7ct:has(.arv.on) .a7cs,.evd .arv.on .abf span{animation:rvLate .4s 2.4s both}
.gqw{position:relative;margin-top:46px}.gqw.nogf{margin-top:0}
.bgb{position:absolute;right:14px;top:-62px;z-index:4;font-size:clamp(64px,10vw,104px);line-height:1;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(250,204,21,.65)) drop-shadow(0 0 18px #facc15);transform-origin:50% 100%;animation:bgbHop 1s infinite}
@keyframes bgbHop{0%,100%{transform:translateY(0) rotate(0) scale(1,1)}12%{transform:translateY(0) scale(1.1,.88)}38%{transform:translateY(-20px) rotate(-10deg) scale(.96,1.06)}62%{transform:translateY(-20px) rotate(10deg) scale(.96,1.06)}86%{transform:translateY(0) scale(1.08,.9)}}
.rar{font-style:normal;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--c);color:#16213e;margin-left:6px;vertical-align:2px}.agf.r3{box-shadow:0 0 16px var(--c)}.agf.r4{box-shadow:0 0 24px var(--c);animation:afBn 1.2s infinite}
.alog p{margin:3px 0;font-size:14px;color:var(--mut)}.alog p:first-child{color:var(--ink);font-weight:700}
.sp{position:absolute;transform:translate(-50%,-50%);min-width:34px;min-height:34px;padding:2px 10px;border-radius:99px;border:2px dashed var(--yel);background:rgba(16,26,58,.78);color:#fff;font:inherit;font-weight:800;font-size:clamp(12px,1.6vw,18px);cursor:pointer}
.sp.f{border-style:solid;background:var(--pri)}.sp.hl{animation:pop 1s infinite}
.sp.ok{background:var(--ok);border-color:#7ef0a4}.sp.bad{background:var(--bad);border-color:#ff9a9d}

.bb.f{color:#fff}.bb.hl{animation:pop 1s infinite}.bb.ok{color:#fff;background:var(--ok);border-color:#7ef0a4}.bb.bad{color:#fff;background:var(--bad);border-color:#ff9a9d}
#pres.light .wd.sel{background:#fff3cf;border-color:#e0a800}
#pres.light .wd.bad{background:var(--bad);color:#fff}#pres.light .wd.okk{background:var(--ok);color:#fff}
#pres.light .cz{border-color:#b6c2e2}#pres.light .cz h3{color:#8a5a00}

/* đấu theo đội */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg label{cursor:pointer;position:relative}.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label span,.seg button{display:block;border:0;font:inherit;font-weight:700;font-size:14px;color:var(--mut);background:transparent;padding:6px 14px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s}
.seg input:checked+span,.seg button.on{background:var(--pri);color:#fff}
.seg input:focus-visible+span{box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}
.tmpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;border:1px dashed var(--pri);border-radius:12px;background:color-mix(in srgb,var(--pri) 8%,transparent)}
.tmpick[hidden]{display:none}.tmpick em{font-style:normal;color:var(--mut);font-size:12px;flex-basis:100%}
.tmcfg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.tmcfg input{width:130px;padding:6px 10px}
.tmbox{flex:none;max-width:1100px;width:100%;margin:0 auto;padding:0 24px 6px}
.tmt{text-align:center;font-weight:800;font-size:clamp(14px,1.8vw,20px);margin-bottom:6px;opacity:.9}.tmt b{color:var(--c)}
.tmw{display:flex;gap:12px;align-items:center;justify-content:center}
.tms{position:relative;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid transparent;transition:border-color .2s,background .2s}
.tms.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);animation:turn 1.4s ease-in-out infinite}
.tms.on .tmn::before{content:'▶ '}.tms.lead .tmn::after{content:' 👑'}
.tms.up{animation:glowg .8s}.tms.dn{animation:shake .45s}
.tme{font-size:clamp(24px,3vw,36px)}
.tmn{font-weight:700;max-width:11ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmv{font-size:clamp(18px,2.4vw,28px);color:var(--c);filter:brightness(1.3);min-width:2ch;text-align:right}
.tmw.tug .tms{flex:none}.tmw.tug .tms:last-child{flex-direction:row-reverse}
.rope{position:relative;flex:1;height:26px;border-radius:99px;background:var(--b);box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.rl{position:absolute;left:0;top:0;bottom:0;min-width:26px;border-radius:99px;background:var(--a);box-shadow:0 0 0 2px rgba(255,255,255,.35),inset 0 2px 6px rgba(255,255,255,.25);transition:width .8s cubic-bezier(.34,1.56,.64,1)}
.knot .kf{display:inline-block;font-style:normal;transform-origin:50% 90%;animation:flick .9s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px #ffb02e)}
.knot{position:absolute;top:50%;z-index:2;transform:translate(-50%,-50%);font-size:34px;line-height:1;transition:left .8s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.tmw.pl .rope{animation:pl .5s}.tmw.pr .rope{animation:pr .5s}
.tmw.pl .knot,.tmw.pr .knot{animation:wob .6s}
.tmw.bars{align-items:flex-end;gap:10px}
.tmw.bars .tms{flex:1;max-width:190px;min-width:0;flex-direction:column;align-items:center;gap:2px;padding:8px 8px 6px}
.vb{position:relative;width:34px;height:84px;border-radius:12px;background:rgba(255,255,255,.12);margin-top:14px}
.vb i{position:absolute;left:0;right:0;bottom:0;border-radius:12px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));transition:height .8s cubic-bezier(.34,1.56,.64,1)}
.rider{position:absolute;left:50%;transform:translate(-50%,50%);font-size:26px;line-height:1;z-index:2;transition:bottom .8s cubic-bezier(.34,1.56,.64,1)}
.tms.up .rider{animation:hop .7s}.tms.dn .rider{animation:drop .45s}
.fl{position:absolute;left:50%;top:-4px;font-style:normal;font-weight:800;font-size:clamp(20px,3vw,30px);pointer-events:none;z-index:5;animation:fl 1.1s ease-out forwards}
.fl.up{color:#7ef0a4}.fl.dn{color:#ff9a9d}
@keyframes turn{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
@keyframes glowg{0%{box-shadow:0 0 0 0 rgba(126,240,164,.9)}100%{box-shadow:0 0 0 18px rgba(126,240,164,0)}}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
@keyframes hop{0%,100%{transform:translate(-50%,50%)}40%{transform:translate(-50%,-15%) scale(1.3)}}
@keyframes drop{20%,60%{transform:translate(calc(-50% - 6px),50%)}40%,80%{transform:translate(calc(-50% + 6px),50%)}}
@keyframes pl{30%{transform:translateX(-9px)}60%{transform:translateX(4px)}}
@keyframes pr{30%{transform:translateX(9px)}60%{transform:translateX(-4px)}}
@keyframes wob{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-50%,-50%) rotate(-20deg)}75%{transform:translate(-50%,-50%) rotate(20deg)}}
.tmwin{font-size:clamp(22px,4vw,40px);font-weight:800;margin:6px 0;color:var(--yel);animation:pop .8s}
.tmrank{display:grid;gap:10px;width:min(560px,100%);margin:10px auto 18px;text-align:left}
.tmr{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.08);overflow:hidden;animation:up .5s both}
.tmr i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--c) 55%,transparent);animation:gw .9s cubic-bezier(.2,.8,.2,1) both}
.tmr span,.tmr b{position:relative;font-weight:700}.tmr span{flex:1}
@keyframes gw{from{width:0}}
@media (max-width:560px){.tmn{max-width:7ch}.knot{font-size:26px}.vb{width:26px}}
#pres.light .tms{background:rgba(22,33,62,.06)}
#pres.light .tms.on{background:color-mix(in srgb,var(--c) 18%,#fff)}
#pres.light .vb{background:rgba(22,33,62,.1)}#pres.light .tmv{filter:none}
#pres.light .tmr{background:#fff}#pres.light .tmwin{color:#d98f00}
/* làm cùng lúc */
.ddg{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;width:100%;max-width:1500px;margin:0 auto;padding:6px 20px 18px}
.dlc{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.06);border:2px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:22px;padding:16px 18px;min-width:0}
.dlc.in{animation:up .45s cubic-bezier(.2,.8,.2,1)}
.dlh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:clamp(15px,1.8vw,22px)}
.dlp{opacity:.8;font-weight:700;font-size:.85em}
.dlk{margin-left:auto;background:var(--c);color:#fff;padding:4px 14px;border-radius:99px;font-weight:800;font-size:.8em;letter-spacing:.06em}
.dlc .ptag{align-self:flex-start}

#pres.light .dlc{background:#fff}

/* chuỗi đúng liên tiếp (lửa) + hiệu ứng đúng/sai */
.stk{display:none;position:absolute;top:-16px;right:-8px;z-index:6;align-items:center;gap:2px;padding:2px 10px 2px 6px;border-radius:99px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff9d1c,#ff4d2e);box-shadow:0 4px 14px -2px rgba(255,90,30,.7);font-size:clamp(14px,1.7vw,20px);line-height:1.2;white-space:nowrap}
.stk.on,.stk.out{display:inline-flex}
.stk.h{position:static}
.stk .fi{font-style:normal;display:inline-block;font-size:calc(1em + var(--lv,1)*.18em);transform-origin:50% 90%;animation:flick .9s ease-in-out infinite alternate;filter:drop-shadow(0 0 calc(2px + var(--lv,1)*3px) #ffb02e)}
.stk u{display:none;text-decoration:none}
.stk.ign{animation:ign .8s cubic-bezier(.2,.9,.3,1.5)}
.stk.bump{animation:bump .5s}
.stk.out{background:#6b7390;box-shadow:none;animation:snuff .9s ease-in forwards}
.stk.out b{display:none}
.stk.out .fi{animation:none;filter:grayscale(1) brightness(.8);transform:scale(.7)}
.stk.out u{display:inline-block;animation:smoke .9s ease-out forwards}
@keyframes flick{0%{transform:scale(1) rotate(-4deg)}35%{transform:scale(1.12,1.2) rotate(3deg)}70%{transform:scale(.95,1.08) rotate(-2deg)}100%{transform:scale(1.08,1.15) rotate(4deg)}}
@keyframes ign{0%{transform:scale(.2);opacity:0}50%{transform:scale(1.5)}100%{transform:scale(1);opacity:1}}
@keyframes bump{40%{transform:scale(1.35)}100%{transform:none}}
@keyframes snuff{0%,70%{opacity:1}100%{opacity:0}}
@keyframes smoke{0%{transform:translateY(4px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-22px) scale(1.4);opacity:0}}
.tms.hot{border-color:#ff9d2e}
.dlc{position:relative}
.dlc.fire{border-color:#ff9d2e}
.dlc.fire::before{content:'';position:absolute;inset:-3px;border-radius:25px;pointer-events:none;box-shadow:0 0 calc(10px + var(--lv,1)*8px) calc(var(--lv,1)*1px) rgba(255,130,30,.6);animation:fglow 1.1s ease-in-out infinite alternate}
@keyframes fglow{from{opacity:.55}to{opacity:1}}
.dlc.hit-ok::after,.dlc.hit-bad::after{content:'';position:absolute;inset:0;border-radius:22px;pointer-events:none;animation:ring .8s ease-out forwards}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let D=null;
try{D=JSON.parse(localStorage.getItem('quizdata')||'null')}catch(e){}
if(!D||!D.classes){D={classes:[{id:uid(),name:'Lớp mẫu',h:225,lessons:[{id:uid(),name:'Bài mẫu: Địa lí Việt Nam',questions:[
{q:'Thủ đô của Việt Nam là thành phố nào?',o:['Hà Nội','Huế','Đà Nẵng','TP. Hồ Chí Minh'],a:0},
{q:'Sông nào dài nhất chảy qua lãnh thổ Việt Nam?',o:['Sông Hồng','Sông Mê Công','Sông Đà','Sông Cầu'],a:1}]}]}]}}
const save=()=>{try{localStorage.setItem('quizdata',JSON.stringify(D))}catch(e){toast('Bộ nhớ trình duyệt đã đầy, hãy dùng hình nhỏ hơn hoặc xoá bớt bài tập')}};
const clampP=v=>Math.min(100,Math.max(1,Math.round(+v)||1));
function normD(){
D.classes.forEach(c=>c.lessons.forEach(l=>l.questions.forEach(q=>{q.p=clampP(q.p);if(l.type==='order'&&q.a==null&&q.q){q.a=q.q;q.q=''}})));
D.classes.forEach(c=>c.lessons.forEach(l=>{if(!l.g&&(l.type||'mc')==='mc'&&l.tm&&l.tm.mode==='duel'&&+l.tm.n===2)l.g='tug';if(l.g==='tug'){l.type='mc';l.tm=Object.assign({n:2,names:[]},l.tm||{});l.tm.n=2;l.tm.mode='duel';l.gs=l.gs||{}}}));
D.classes.forEach(c=>{c.units=c.units||[];const orph=c.lessons.filter(l=>!l.u||!c.units.some(u=>u.id===l.u));if(orph.length){let u=c.units[0];if(!u){u={id:uid(),name:'Bài học chung',date:''};c.units.push(u)}orph.forEach(l=>l.u=u.id)}});
}
normD();
let V={c:null,u:null,l:null},P=null,M=null;
const curC=()=>D.classes.find(x=>x.id===V.c),curL=()=>{const c=curC();return c&&c.lessons.find(x=>x.id===V.l)},curU=()=>{const c=curC();return c&&c.units.find(x=>x.id===V.u)};
const fmtDate=d=>d?String(d).split('-').reverse().join('/'):'';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- Nhận diện câu hỏi ---------- */
const FM='\uE000',FE='\uE001',OKT=/\s*(?:\(\s*(?:đúng|correct|x)\s*\)|\[\s*(?:đúng|correct|x)\s*\]|[*✓✔✅☑])+\s*$/iu;
/* tách một dòng thành các phương án (A. B. C. D.), nhớ phương án nào được in đậm / gạch chân */
function segs(s){
 let t='',f=[],on=false;
 for(let i=0;i<s.length;i++){const ch=s[i];if(ch===FM){on=true;continue}if(ch===FE){on=false;continue}t+=ch;f.push(on&&/\S/.test(ch))}
 const cuts=[0];
 if(/^[*✓✔✅☑]?\s*\(?A[.)]/.test(t)&&/\s[*✓✔✅☑]?\(?B[.)]\s/.test(t))for(const m of t.matchAll(/\s+(?=[*✓✔✅☑]?\(?[B-D][.)]\s)/g))cuts.push(m.index);
 cuts.push(t.length);
 return cuts.slice(0,-1).map((a,j)=>({t:t.slice(a,cuts[j+1]).trim(),f:f.slice(a,cuts[j+1]).some(Boolean)}));
}
function optTake(c,p,f){
 const m=p.match(/^([*✓✔✅☑]?)\s*\(?([A-Da-d])[.)]\s*(.*)$/u);if(!m)return false;
 const k='ABCD'.indexOf(m[2].toUpperCase());let x=m[3],ok=!!m[1];
 if(OKT.test(x)){ok=true;x=x.replace(OKT,'')}
 c.o[k]=x;if(ok)c.a=k;if(f)c.fm.add(k);c.last=k;return true;
}
const KH=/^(?:đáp án|dap an|đ\/a|đa|answer|ans|key)\s*(?:đúng)?\s*(?:là)?\s*[:：\-.=]?\s*(.*)$/iu;
function parse(t){
 const out=[],PR=/(\d+)\s*[.:\-)=]?\s*\(?([A-Da-d])\)?(?![\p{L}\d])/gu,key={};let c=null,hdr=false;
 const flush=()=>{if(c){if(c.a<0&&c.fm.size===1)c.a=[...c.fm][0];delete c.last;delete c.fm;c.p=1;c.q=c.q.trim();c.o=c.o.map(s=>s.trim());if(c.q)out.push(c);c=null}};
 const pairs=x=>{if(x.replace(PR,'').replace(/[\s,;|]+/g,''))return 0;let n=0;for(const m of x.matchAll(PR)){key[m[1]]='ABCD'.indexOf(m[2].toUpperCase());n++}return n};
 for(const raw of t.replace(/\r/g,'').split('\n')){
  const s=raw.trim(),sc=s.replace(/[\uE000\uE001]/g,'');if(!sc)continue;let m;
  if(hdr&&pairs(sc))continue;
  hdr=false;
  if((m=sc.match(KH))){
   const r=m[1].trim();
   if(!r){hdr=true;continue}
   if(pairs(r))continue;
   const lm=r.match(/^\(?([A-Da-d])\)?(?:\s*[.):]\s*.*)?$/u);
   if(lm){if(c)c.a='ABCD'.indexOf(lm[1].toUpperCase());continue}
   if(c){const k=c.o.findIndex(o=>o&&norm(o)===norm(r));if(k>=0){c.a=k;continue}}
  }
  if(/^(?:\d+\s*[.:\-)=]?\s*\(?[A-Da-d]\)?(?![\p{L}\d])[\s,;|]*){2,}$/u.test(sc)&&pairs(sc))continue;
  if((m=sc.match(/^(?:câu|question|q)?\s*(\d+)\s*[.:)\-]\s*(.*)$/iu))){
   flush();let q=m[2],a=-1;
   const im=q.match(/\s*[\(\[]\s*(?:đáp án|đ\/a|answer|ans|key)\s*[:\-=]?\s*([A-Da-d])\s*[\)\]]\s*$/iu);
   if(im){a='ABCD'.indexOf(im[1].toUpperCase());q=q.slice(0,im.index)}
   c={q,o:['','','',''],a,n:m[1],fm:new Set(),last:null};continue;
  }
  if(!c)continue;
  for(const p of segs(s)){if(!optTake(c,p.t,p.f)){if(c.last!=null)c.o[c.last]+=' '+p.t;else c.q+=' '+p.t}}
 }
 flush();
 out.forEach(q=>{if(q.a<0&&key[q.n]!=null)q.a=key[q.n];delete q.n});
 return out;
}
/* sắp xếp từ: mỗi dòng một câu */
function parseOrder(t){
 const r=parseText(t).filter(x=>x.a&&x.a.trim());
 if(r.length)return r;
 return parseOrderOld(t).map(x=>({q:'',a:x.q,p:1}));
}
function parseOrderOld(t){
 return t.replace(/\r/g,'').split('\n').map(s=>s.trim().replace(/^(?:câu\s*)?\d+\s*[.):]\s+/i,'')).filter(s=>s.split(/\s+/).length>=2).map(s=>({q:s,p:1}));
}
/* True / False / Not Given */
const tfv=s=>{s=norm(s).replace(/\s/g,'');return ['true','t','dung','yes','y'].includes(s)?0:['false','f','sai','no'].includes(s)?1:['notgiven','ng','n','notmentioned','khongdecap','khongduocdecap'].includes(s)?2:-1};
function parseTFNG(t){
 const passages={},qs=[],NUM=/^(?:câu|question|q)?\s*(\d+)\s*[.:)\-]\s*(.*)$/iu,KEY=/^(?:đáp án|đ\/a|answer|ans|key)\s*(?:đúng)?\s*[:：=\-]?\s*(.*)$/iu,
  PR=/(\d+)\s*[.:\-)=]?\s*(not\s*given|true|false|ng|t|f|n|đúng|sai)(?![\p{L}])/giu,
  WD=/not\s*given|true|false|\bng\b|\bt\b|\bf\b|đúng|sai/giu,
  onlyAns=x=>{const tk=[...x.matchAll(WD)];return tk.length&&x.replace(WD,'').replace(/[\s,;|\/.\-–—]+/g,'')===''?tk.map(v=>tfv(v[0])):null},
  sp=x=>{
   let m=x.match(/^(.*?)\s*(?:→|->|=>|⇒)\s*(.+)$/u);if(m&&tfv(m[2])>=0)return[m[1],tfv(m[2])];
   m=x.match(/^(.*?)\s*[\(\[]\s*([^)\]]+?)\s*[\)\]]\s*$/u);if(m&&tfv(m[2])>=0)return[m[1],tfv(m[2])];
   m=x.match(/^(.*?[.!?])\s+(not\s*given|true|false|ng)\s*\.?\s*$/iu);if(m)return[m[1],tfv(m[2])];
   m=x.match(/^(.*?)\s*(?:[:|–—\/]|\s-)\s*(not\s*given|true|false|ng|t|f|đúng|sai)\s*\.?\s*$/iu);if(m&&m[1].trim())return[m[1],tfv(m[2])];
   return[x,-1]};
 for(const sec of t.replace(/\r/g,'').split(/\n\s*-{3,}\s*(?=\n|$)/)){
  const pid=uid(),pas=[],g=[],key={};let c=null,st=false,m,seq=[];
  for(const raw of sec.split('\n')){
   const s=raw.trim();
   if(!st){if((m=s.match(NUM))&&m[1]==='1')st=true;else{pas.push(raw);continue}}
   if(!s)continue;
   if((m=s.match(KEY))){
    const r=m[1].trim(),ps=[...r.matchAll(PR)];
    if(ps.length)ps.forEach(x=>{key[x[1]]=tfv(x[2])});
    else{const a=onlyAns(r)||[];if(a.length>1)seq=a;else if(c&&a.length===1)c.a=a[0];else if(c)c.a=tfv(r)}
    continue}
   if((m=s.match(/^(?:→|->|=>|⇒)\s*(.*)$/u))){if(c)c.a=tfv(m[1]);continue}
   const oa=onlyAns(s);
   if(oa&&c){if(oa.length>1)seq=oa;else c.a=oa[0];continue}
   if((m=s.match(NUM))){
    const ex=g.find(q=>q.n===m[1]);
    if(ex&&tfv(m[2])>=0){ex.a=tfv(m[2]);continue}
    const [x,a]=sp(m[2]);c={q:x,a,p:1,pid,n:m[1]};g.push(c)}
   else if(c)c.q+=' '+s;
  }
  g.forEach((q,i)=>{if(key[q.n]!=null)q.a=key[q.n];else if(seq[i]!=null&&q.a<0)q.a=seq[i]});
  if(g.length){passages[pid]=pas.join('\n').trim();qs.push(...g)}
 }
 return {passages,qs};
}
/* ---------- Dạng bài ---------- */
const TYPES={
 mc:{n:'Trắc nghiệm',i:'🔘',d:'Chọn 1 trong 4 đáp án'},
 essay:{n:'Tự luận',i:'✍️',d:'Gõ câu trả lời, đối chiếu đáp án'},
 match:{n:'Nối',i:'🔗',d:'Nối vế trái với vế phải'},

const ARR=/^(?:→|->|=>|⇒|➜|➔)\s*(.*)$/u;
const ANSW=/^(?:đáp án|đ\/a|answer|ans|key)\s*(?:đúng)?\s*[:：=\-]\s*(.*)$/iu;
const ANSW0=/^(?:đáp án|answer)\s*$/iu;
const PAIR=/^(.+?)\s*(?:→|->|=>|⇒|\t|\s[-–—]\s|\s?=\s?|:|\|)\s*(.+)$/u;
function parseText(t){
 const out=[],NUM=/^(?:câu|question|q)?\s*(\d+)\s*[.:)\-]\s*(.*)$/iu;let c=null;
 const lines=t.replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
 const isA=s=>ARR.test(s)||ANSW.test(s)||ANSW0.test(s);
 const hasNum=lines.some(s=>!isA(s)&&NUM.test(s));
 const flush=()=>{if(c&&c.q.trim())out.push({q:c.q.trim(),a:c.a.trim(),p:1});c=null};
 for(const s of lines){
  let m=s.match(ARR)||s.match(ANSW)||(ANSW0.test(s)?['','']:null);
  if(m){if(c){c.in=true;c.a+=(c.a?'\n':'')+(m[1]||'')}continue}
  if(hasNum){
   if((m=s.match(NUM))){flush();c={q:m[2],a:'',in:false}}
   else if(c){if(c.in)c.a+=(c.a?'\n':'')+s;else c.q+='\n'+s}
   continue;
  }
  if(!c||c.in){flush();c={q:s,a:'',in:false}}else c.q+='\n'+s;
 }
 flush();return out;
}
function parseVocab(t){
 const out=[];
 for(const raw of t.replace(/\r/g,'').split('\n')){
  const s=raw.trim().replace(/^(?:câu\s*)?\d+\s*[.)]\s+/i,''),m=s.match(PAIR);
  if(m&&m[1].trim()&&m[2].trim())out.push({q:m[1].trim(),a:m[2].trim(),p:1});
 }
 return out;
}
function parseMatch(t){
 const blocks=[];let b=null;const nb=()=>{b={title:'',pairs:[]};blocks.push(b)};
 for(const raw of t.replace(/\r/g,'').split('\n')){
  const s=raw.trim();
  if(!s){b=null;continue}
  const h=s.match(/^(?:câu|question|q)\s*\d+\s*[.:)\-]?\s*(.*)$/iu);
  if(h){nb();b.title=h[1];continue}
  const m=s.replace(/^\d+\s*[.)]\s+/,'').match(PAIR);
  if(!b)nb();
  if(m)b.pairs.push([m[1].trim(),m[2].trim()]);
  else if(!b.pairs.length)b.title=(b.title?b.title+' ':'')+s;
 }
 let qs=blocks.filter(x=>x.pairs.length>=2);
 if(!qs.length){const all=blocks.flatMap(x=>x.pairs);qs=all.length>=2?[{title:'',pairs:all}]:[]}
 return qs.map(x=>({q:x.title.trim(),pairs:x.pairs,p:1}));
}

 const tabs=`<div class="tmtabs">`+[0,1].map(k=>{const qs=l.questions.filter(q=>q.ti===k);return `<button class="tmtab${ATM===k?' on':''}" style="--c:${TMC[k]}" data-act="tmtab" data-k="${k}">${TME[k]} ${nm(k)}<small>${qs.length} câu · ${qs.reduce((a,q)=>a+clampP(q.p),0)} điểm</small></button>`}).join('')+`</div><p class="sub" style="font-size:13px;margin:0 0 10px">Đang soạn bộ câu hỏi của <b>${nm(ATM)}</b>. Thêm câu hỏi, dán văn bản hay tải file lên đều được lưu vào đội này.</p>`;
 return tabs+dwarnHTML(l)+(ix.length?ix.map(i=>qEdit(l,l.questions[i],i)).join(''):`<div class="empty">${nm(ATM)} chưa có câu hỏi. Hãy tải file lên hoặc thêm thủ công.</div>`)}
function qEdit(l,q,i){
 const t=T(l);let warn='',body='';
 const lbl=x=>`<div class="lbl">${x}</div>`;
 if(t==='mc'||t==='passage'||t==='dictmc'||t==='odd'){
  if(q.a<0)warn='<span class="warn">Chưa chọn đáp án đúng</span>';
  body=qHead(t,q,i)+[0,1,2,3].map(k=>`<label class="opt"><input type="radio" name="r${i}" data-act="setans" data-i="${i}" data-k="${k}" ${q.a===k?'checked':''} title="Đáp án đúng"><span>${'ABCD'[k]}</span><input type="text" data-f="o" data-i="${i}" data-k="${k}" value="${esc(q.o[k])}" placeholder="Đáp án ${'ABCD'[k]}"></label>`).join('')+qTail(t,q,i);
 }else if(t==='order'){
  if(String(q.a||'').trim().split(/\s+/).filter(Boolean).length<2)warn='<span class="warn">Đáp án cần ít nhất 2 từ</span>';
  body=lbl('Đề bài (các từ xáo trộn hoặc yêu cầu)')+`<textarea data-f="q" data-i="${i}" placeholder="goes / She / school / to / every day">${esc(q.q)}</textarea>`+lbl('Đáp án (câu hoàn chỉnh, mỗi cách đúng một dòng)')+`<textarea data-f="a" data-i="${i}" placeholder="She goes to school every day.">${esc(q.a)}</textarea>`;
 }else if(t==='tfng'||t==='tf'){
  if(q.a<0)warn='<span class="warn">Chưa chọn đáp án</span>';
  body=lbl('Nhận định (statement)')+`<textarea data-f="q" data-i="${i}">${esc(q.q)}</textarea>`+(t==='tf'?['Đúng','Sai']:['True','False','Not Given']).map((x,k)=>`<label class="opt"><input type="radio" name="r${i}" data-act="setans" data-i="${i}" data-k="${k}" ${q.a===k?'checked':''}><span>${(t==='tf'?'ĐS':'TFN')[k]}</span><b style="color:var(--ink)">${x}</b></label>`).join('');
 }else if(t==='match'||t==='cat'){
  const ps=q.pairs||[];
  if(ps.filter(p=>p[0].trim()&&p[1].trim()).length<2)warn='<span class="warn">Cần ít nhất 2 cặp</span>';
  body=`<input type="text" data-f="q" data-i="${i}" value="${esc(q.q)}" placeholder="Yêu cầu (không bắt buộc), ví dụ: Nối từ với nghĩa">`+
   ps.map((p,k)=>`<div class="opt"><span>${k+1}</span><input type="text" data-f="pl" data-i="${i}" data-k="${k}" value="${esc(p[0])}" placeholder="${t==='cat'?'Từ / mục':'Vế trái'}"><b>=</b><input type="text" data-f="pr" data-i="${i}" data-k="${k}" value="${esc(p[1])}" placeholder="${t==='cat'?'Nhóm':'Vế phải'}"><button class="ib" style="background:var(--bg)" title="Xoá cặp" data-act="delpair" data-i="${i}" data-k="${k}">✕</button></div>`).join('')+
   `<button class="b g" style="margin-top:10px" data-act="addpair" data-i="${i}">+ Thêm cặp</button>`;
 }else if(['vocab','flash','memory','scramble'].includes(t)){
  if(!String(q.a||'').trim())warn='<span class="warn">Chưa có nghĩa</span>';
  body=lbl(t==='scramble'?'Gợi ý (nghĩa tiếng Việt hoặc mô tả)':'Từ / cụm từ')+`<input type="text" data-f="q" data-i="${i}" value="${esc(q.q)}" placeholder="dog">`+lbl(t==='scramble'?'Từ cần đoán':'Nghĩa (nhiều nghĩa ngăn cách bằng “/”)')+`<input type="text" data-f="a" data-i="${i}" value="${esc(q.a)}" placeholder="chó">`;
 }else if(t==='fill'||t==='bank'){
  const f=fillParts(q),hasB=String(q.q||'').split(BLK).length>1;
  if(!hasB)warn='<span class="warn">Chưa có chỗ trống (___)</span>';
  else if(!String(q.a||'').trim())warn='<span class="warn">Chưa có đáp án</span>';
  else if(f&&f.miss)warn='<span class="warn">Số đáp án chưa khớp số chỗ trống</span>';
  body=lbl('Câu có chỗ trống (đánh dấu bằng ___ hoặc … hoặc ...)')+`<textarea data-f="q" data-i="${i}" placeholder="She ___ to school every day.">${esc(q.q)}</textarea>`+lbl('Đáp án (phần còn thiếu, hoặc cả câu hoàn chỉnh)')+`<textarea data-f="a" data-i="${i}" placeholder="goes">${esc(q.a)}</textarea>`+(f&&!f.miss?`<div class="lbl">Phần cần điền (sau khi lưu): <b>${esc(f.ans.map(x=>x.join(' / ')).join('  |  '))}</b></div>`:'');
 }else if(t==='dict'){
  if(!String(q.q||'').trim())warn='<span class="warn">Chưa có câu máy sẽ đọc</span>';
  body=lbl('Câu máy sẽ đọc (đây cũng là đáp án học sinh cần gõ)')+`<textarea data-f="q" data-i="${i}" placeholder="She goes to school every day.">${esc(q.q)}</textarea>`+lbl('Cách viết khác cũng được chấp nhận (không bắt buộc, mỗi cách một dòng)')+`<textarea data-f="a" data-i="${i}" rows="2" placeholder="She goes to school everyday.">${esc(q.a)}</textarea>`;
 }else if(t==='guess'){
  if(!q.img)warn='<span class="warn">Chưa có hình</span>';else if(!String(q.a||'').trim())warn='<span class="warn">Chưa có từ cần đoán</span>';
  body=`<div style="margin-bottom:10px"><button class="b g" data-act="imgup" data-i="${i}">🖼 ${q.img?'Đổi hình':'Chọn hình'}</button></div>`+(q.img?`<div class="lw ed" style="cursor:default"><img src="${q.img}" alt=""></div>`:'')+lbl('Từ tiếng Anh cần đoán (nhiều cách viết thì ngăn cách bằng “/”)')+`<input type="text" data-f="a" data-i="${i}" value="${esc(q.a)}" placeholder="dog">`+lbl('Gợi ý thêm cho học sinh (không bắt buộc), ví dụ: con vật nuôi trong nhà')+`<input type="text" data-f="q" data-i="${i}" value="${esc(q.q)}" placeholder="Đây là gì?">`;
 }else if(t==='speak'){
  if(!String(q.q||'').trim())warn='<span class="warn">Chưa có câu cần đọc</span>';
  body=lbl('Câu / đoạn cần đọc (tiếng Anh)')+`<textarea data-f="q" data-i="${i}" placeholder="She goes to school every day.">${esc(q.q)}</textarea>`;
 }else if(t==='dialog'){
  if(String(q.a||'').split('\n').filter(x=>x.trim()).length<2)warn='<span class="warn">Cần ít nhất 2 câu thoại</span>';
  body=lbl('Tiêu đề / bối cảnh (không bắt buộc)')+`<input type="text" data-f="q" data-i="${i}" value="${esc(q.q)}" placeholder="Chào hỏi">`+lbl('Các câu thoại theo đúng thứ tự (mỗi câu một dòng)')+`<textarea data-f="a" data-i="${i}" rows="6" placeholder="A: Hi, how are you?">${esc(q.a)}</textarea>`;
 }else if(t==='label'){
  const pts=q.pts||[];
  if(!q.img)warn='<span class="warn">Chưa có hình</span>';else if(pts.filter(p=>String(p.t||'').trim()).length<2)warn='<span class="warn">Cần ít nhất 2 điểm gắn nhãn</span>';
  body=`<input type="text" data-f="q" data-i="${i}" value="${esc(q.q)}" placeholder="Yêu cầu (không bắt buộc), ví dụ: Gắn nhãn các bộ phận của con mèo"><div style="margin-top:10px"><button class="b g" data-act="imgup" data-i="${i}">🖼 ${q.img?'Đổi hình':'Chọn hình'}</button></div>`+
   (q.img?`<div class="lbl">Bấm lên hình để thêm điểm gắn nhãn</div><div class="lw ed" data-act="imgpt" data-i="${i}"><img src="${q.img}" alt="">${pts.map((p,k)=>`<span class="mk" style="left:${p.x}%;top:${p.y}%">${k+1}</span>`).join('')}</div>`+pts.map((p,k)=>`<div class="opt"><span>${k+1}</span><input type="text" data-f="lt" data-i="${i}" data-k="${k}" value="${esc(p.t)}" placeholder="Nhãn"><button class="ib" style="background:var(--bg)" title="Xoá điểm" data-act="delpt" data-i="${i}" data-k="${k}">✕</button></div>`).join(''):'');
 }else{
  if(!String(q.a||'').trim())warn='<span class="warn">Chưa có đáp án</span>';
  const fx=t==='fix';
  body=lbl(fx?'Câu có lỗi sai':'Câu hỏi / mẫu câu')+`<textarea data-f="q" data-i="${i}">${esc(q.q)}</textarea>`+lbl(fx?'Câu đã sửa đúng (đáp án)':'Đáp án')+`<textarea data-f="a" data-i="${i}">${esc(q.a)}</textarea>`;
 }
 let pre='';
 if(t==='passage'||t==='tfng'){
  if(t==='passage')body=`<div class="pt" style="margin-bottom:8px">Chỗ trống số <input type="number" min="1" data-f="n" data-i="${i}" value="${esc(q.n||'')}"></div>`+body;
  if(i===0||l.questions[i-1].pid!==q.pid)pre=`<div class="qc"><div class="qh"><span>📄 Đoạn văn</span><button class="ib" style="background:var(--bg)" title="Xoá đoạn văn và các câu của nó" data-act="delpass" data-pid="${esc(q.pid)}">🗑</button></div><textarea rows="9" data-f="pt" data-pid="${esc(q.pid)}" placeholder="Dán đoạn văn vào đây. Đánh dấu chỗ trống bằng (1) ______, (2) ______ …">${esc((l.passages||{})[q.pid]||'')}</textarea></div>`;
 }
 return `${pre}<div class="qc"><div class="qh"><span>Câu ${QNUM&&QNUM[i]?QNUM[i]:i+1}${warn}</span><span style="display:flex;gap:12px;align-items:center"><span class="pt">Điểm <input type="number" min="1" max="100" step="1" value="${clampP(q.p)}" data-f="p" data-i="${i}"></span><button class="ib" style="background:var(--bg)" title="Xoá câu" data-act="delq" data-i="${i}">🗑</button></span></div>${body}</div>`;
}

function lessonStatus(x){
 const r=getResume(x);
 if(r)return `<div class="st mid">⏸ Đang làm dở · ${resumeText(r.p)}</div>`;
 const gm=x.g&&x.g!=='tug'?getGame(x):null;
 if(gm)return `<div class="st mid">⏸ Đang chơi dở · ${esc(gm.txt)}</div>`;
 if(x.done)return `<div class="st done">✓ Hoàn thành${x.best?` · ${fmt(x.best.sc)}/${x.best.tot} điểm`:''}</div>`;
 return `<div class="st new">Chưa làm</div>`;
}

 return r?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b g" data-act="playnew">↺ Làm lại từ đầu</button><button class="b p" data-act="play">▶ Tiếp tục · ${resumeText(r.p)}</button></div>`:`<button class="b p" data-act="play">▶ Trình chiếu</button>`;
}

async function docxText(buf,fmt){
 if(fmt)try{
  const r=await mammoth.convertToHtml({arrayBuffer:buf},{styleMap:['u => u']}),d=new DOMParser().parseFromString(r.value,'text/html'),B='p,li,h1,h2,h3,h4,h5,h6';
  const w=(n,f)=>n.nodeType===3?n.nodeValue:n.nodeType!==1?'':n.tagName==='BR'?'\n':/^(STRONG|B|U)$/.test(n.tagName)&&!f?FM+[...n.childNodes].map(x=>w(x,1)).join('')+FE:[...n.childNodes].map(x=>w(x,f)).join('');
  const t=[...d.body.querySelectorAll(B)].filter(e=>!e.querySelector(B)).map(e=>w(e)).join('\n');
  if(t.trim())return t;
 }catch(e){}
 return (await mammoth.extractRawText({arrayBuffer:buf})).value;

 clsPost(t,a,b,cx,tn)}else{{const cl=clsDef(G.cls[t]);if(cl&&cl.k==='c'&&(a.cc||0)>=clsVal(G.s,cl.id,'need'))G.log.unshift(`🛡 ${AN(t)} trả lời sai nhưng nội tại đã nạp đầy vẫn được giữ`);else{if(a.cc>0)G.log.unshift(`💔 ${AN(t)} trả lời sai, chuỗi nội tại về 0`);a.cc=0}}G.log.unshift(`✖ ${AN(t)} trả lời sai: không có quà, không gây sát thương`)}
